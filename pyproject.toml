[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-log-anomaly"
version = "0.1.0"
description = "Thesis project for anomaly detection in event logs with Drain, EVT, and LLM-assisted triage."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "drain3>=0.9",
    "joblib>=1.3",
    "lmoments3>=1.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
retrieval = [
    "sentence-transformers>=3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
norecursedirs = [
    "pytest-cache-files-*",
]
